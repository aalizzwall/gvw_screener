version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pip
    directory: /src/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
