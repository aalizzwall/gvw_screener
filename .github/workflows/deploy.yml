name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax and compile check
        run: |
          python -m py_compile $(find src gvw_bot tests -name "*.py")

      - name: Critical lint check (Ruff)
        run: |
          python -m pip install ruff
          ruff check src/ gvw_bot/ tests/ --select E9,F63,F7,F82 --show-source

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  deploy:
    needs: [test, security-scan]
    if: github.repository == 'aalizzwall/gvw_screener' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: gvw-production-deploy
      cancel-in-progress: false
    env:
      APP_DIR: /home/pi/.hermes/gvw_screener
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and restart service
        run: |
          set -euo pipefail
          test "$(id -un)" = "pi"
          mkdir -p "$APP_DIR"
          test -f "$APP_DIR/.env"

          rsync -a \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='*.db' \
            --exclude='venv*/' \
            --exclude='.venv/' \
            ./ "$APP_DIR/"

          python3 -m venv "$APP_DIR/.venv"
          "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$APP_DIR/.venv/bin/python" -m pip install -r "$APP_DIR/requirements.txt"

          mkdir -p "$HOME/.config/systemd/user"
          install -m 0644 "$APP_DIR/systemd/gvw_bot.service" \
            "$HOME/.config/systemd/user/gvw_bot.service"
          systemctl --user daemon-reload
          systemctl --user enable gvw_bot
          systemctl --user restart gvw_bot
          sleep 5
          systemctl --user is-active --quiet gvw_bot
