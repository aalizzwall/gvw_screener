name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, ARM64]
    concurrency:
      group: gvw-production-deploy
      cancel-in-progress: false
    env:
      APP_DIR: /home/pi/.hermes/gvw_screener
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and restart service
        run: |
          set -euo pipefail
          test "$(id -un)" = "pi"
          mkdir -p "$APP_DIR"
          test -f "$APP_DIR/.env"

          rsync -a \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='*.db' \
            --exclude='venv*/' \
            --exclude='.venv/' \
            ./ "$APP_DIR/"

          python3 -m venv "$APP_DIR/.venv"
          "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$APP_DIR/.venv/bin/python" -m pip install -r "$APP_DIR/requirements.txt"

          mkdir -p "$HOME/.config/systemd/user"
          install -m 0644 "$APP_DIR/systemd/gvw_bot.service" \
            "$HOME/.config/systemd/user/gvw_bot.service"
          systemctl --user daemon-reload
          systemctl --user enable gvw_bot
          systemctl --user restart gvw_bot
          sleep 5
          systemctl --user is-active --quiet gvw_bot
